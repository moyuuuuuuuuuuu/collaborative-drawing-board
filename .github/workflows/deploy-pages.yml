name: Deploy to GitHub Pages

on:
  push:
    branches:
      - ts  # 监听 ts 分支的提交

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20  # 可根据你本地 Node 版本调整

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 构建前端
      - name: Build
        run: npm run build

      # 5. 部署到 GitHub Pages
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Vite 默认构建输出目录
          publish_branch: gh-pages  # GitHub Pages 发布分支
